# Herdr configuration — ~/Development/workbench
# Starter config tuned for this machine. Edit and `herdr server reload-config`.

onboarding = false

[theme]
# Follow host light/dark. Dawn on light surfaces; rose-pine on dark.
name = "rose-pine-dawn"
auto_switch = true
dark_name = "rose-pine"
light_name = "rose-pine-dawn"

[theme.custom]
# Transparent chrome so Herdr matches the outer terminal background.
panel_bg = "reset"
# Graphite for selection and structural emphasis; no decorative copper.
accent = "#50656c"
# Accessible semantic colors on the light terminal surface.
peach = "#a4513f"
yellow = "#8a6a1f"
red = "#b34444"
green = "#397452"
blue = "#3f6784"
teal = "#397469"
mauve = "#735a83"

[terminal]
# $SHELL (zsh) is picked up automatically; leave empty.
default_shell = ""
# Auto mode launches the configured login shell correctly on Linux and macOS.
shell_mode = "auto"
# New panes inherit the source pane's cwd — stays in-project when splitting.
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+b"
# Vim-style pane navigation in prefix mode.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
# Swap panes with shift
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
# Fast navigation: alt+h/l for tabs, alt+shift+h/l for workspaces.
# (keep prefix+n/p as fallback for terminal-ssh where alt chords may not pass through)
next_tab = ["prefix+n", "alt+l"]
previous_tab = ["prefix+p", "alt+h"]
# Switch tabs directly: prefix+1..9
switch_tab = "prefix+1..9"
# Workspace switching
previous_workspace = "alt+shift+h"
next_workspace = "alt+shift+l"
switch_workspace = "prefix+shift+1..9"
# Agent focus
focus_agent = "prefix+alt+1..9"
# Cycle agents in attention order (pairs with alt+shift+h/l workspace nav:
# h/l = workspaces, j/k = agents). Requires agent_panel_sort = "priority".
next_agent = "alt+shift+j"
previous_agent = "alt+shift+k"
# Zoom, sidebar, copy mode
zoom = "prefix+z"
toggle_sidebar = "prefix+b"
copy_mode = "prefix+["
detach = "prefix+q"
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
new_tab = "prefix+c"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
resize_mode = "prefix+r"

[ui]
sidebar_width = 24
mouse_capture = true
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
# Cleaner single-agent workspaces.
hide_tab_bar_when_single_tab = true
# Attention queue: surface blocked/done agents ahead of working ones, so
# next_agent/previous_agent (alt+shift+j/k) walk what needs attention first.
agent_panel_sort = "priority"
accent = "#50656c"
# 0.7.5: ask for a workspace name at interactive creation - named spaces
# keep the sidebar and session navigator legible across a wide fleet.
prompt_new_workspace_name = true

# 0.7.4: agent-aware sidebar. row_gap=1 adds a blank line between agent
# entries so each reads as a discrete item rather than a packed list
# (release-notes-recommended separation). terminal_title_stripped shows
# what the agent is doing without spinner glyphs.
# 0.7.5: per-token styling. Visual hierarchy per agent entry: bold agent
# name (the identity), contextual state colors untouched (semantic), dim
# activity line and location line (context, not signal). fg stays unset
# on state_icon/state_text/git_status so semantic colors survive.
[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", dim = true }, { token = "tab", dim = true }],
  [{ token = "agent", bold = true }],
]

[ui.sidebar.agents.rows_by_agent]
omp = [
  ["state_icon", { token = "agent", bold = true }, "state_text"],
  [{ token = "$model", dim = true }],
  [{ token = "$summary", dim = true }],
  [{ token = "terminal_title_stripped", dim = true }],
  [{ token = "workspace", dim = true }, { token = "tab", dim = true }],
]
claude = [
  ["state_icon", { token = "agent", bold = true }, "state_text"],
  [{ token = "terminal_title_stripped", dim = true }],
  [{ token = "workspace", dim = true }, { token = "tab", dim = true }],
]
codex = [
  ["state_icon", { token = "agent", bold = true }, "state_text"],
  [{ token = "terminal_title_stripped", dim = true }],
  [{ token = "workspace", dim = true }, { token = "tab", dim = true }],
]
pi = [
  ["state_icon", { token = "agent", bold = true }, "state_text"],
  [{ token = "terminal_title_stripped", dim = true }],
  [{ token = "workspace", dim = true }, { token = "tab", dim = true }],
]
opencode = [
  ["state_icon", { token = "agent", bold = true }, "state_text"],
  [{ token = "terminal_title_stripped", dim = true }],
  [{ token = "workspace", dim = true }, { token = "tab", dim = true }],
]

# 0.7.4: row_gap=1 mirrors the agents section for consistent visual
# separation between space entries.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
# In-app toasts for agent state changes
delivery = "off"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
# Audio cue when an agent finishes or needs attention in a background workspace
enabled = false

[session]
# Resume agent conversations after server restart (requires integrations)
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
# Save pane scrollback across full server restarts
pane_history = true
switch_ascii_input_source_in_prefix = true
