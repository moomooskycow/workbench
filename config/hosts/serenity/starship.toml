# Serenity: cool, terminal-native prompt with explicit local identity.
add_newline = true
command_timeout = 1500
palette = "terminal-ink"

format = "${custom.serenity}$directory$git_branch${custom.git_dirty}$git_state$git_status$cmd_duration$jobs$status$line_break$character"

[palettes.terminal-ink]
muted = "bright-black"
cool = "cyan"
path = "blue"
git = "purple"
good = "green"
warn = "yellow"
bad = "red"

[custom.serenity]
command = "printf serenity"
when = "true"
style = "bold cool"
format = "[$output]($style)  "

[directory]
style = "bold path"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"
read_only = " "
read_only_style = "bad"

[git_branch]
symbol = ""
format = "([on $branch]($style) )"
style = "git"
truncation_length = 28
truncation_symbol = "…"

[git_state]
format = '\[[$state( $progress_current/$progress_total)]($style)\] '
style = "bad"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "warn"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = ""
modified = ""
staged = ""
renamed = ""
deleted = ""
stashed = ""

[custom.git_dirty]
when = "git status --porcelain 2>/dev/null | grep -q ."
command = "printf '±'"
format = "[$output](warn) "
shell = ["sh"]

[cmd_duration]
min_time = 1500
format = "[$duration](warn) "

[jobs]
symbol = "◌"
format = "[$symbol$number](muted) "

[status]
disabled = false
format = "[✕ $status](bad) "

[character]
success_symbol = "[>](cool)"
error_symbol = "[>](bad)"
vimcmd_symbol = "[<](git)"
