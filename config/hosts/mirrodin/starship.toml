# Starship — terminal-native ink prompt, Nerd Font glyphs, two-line prompt
# Palette names resolve through the terminal's active ANSI theme.
add_newline = true
command_timeout = 2000
palette = "terminal-ink"

format = """
$hostname\
$directory\
$git_branch\
${custom.git_dirty}\
$git_state\
$git_status\
$fill\
$cmd_duration\
$jobs\
$line_break\
$status\
$character"""

[palettes.terminal-ink]
base = "black"
surface = "bright-black"
overlay = "bright-black"
muted = "bright-black"
subtle = "bright-white"
text = "white"
love = "red"
gold = "yellow"
rose = "bright-red"
pine = "green"
foam = "cyan"
iris = "purple"

[fill]
symbol = " "
style = "overlay"

[directory]
style = "bold foam"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"
read_only = " 🔒"
read_only_style = "love"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
format = "[$branch]($style) "
style = "iris"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "gold"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = ""
modified = ""
staged = ""
renamed = ""
deleted = ""
stashed = ""

[custom.git_dirty]
when = "git status --porcelain 2>/dev/null | grep -q ."
command = "printf '±'"
format = "[$output](gold) "
shell = ["sh"]

[git_state]
format = '\[[$state( $progress_current/$progress_total)]($style)\] '
style = "love"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "gold"

[character]
success_symbol = "[>](purple)"
error_symbol = "[>](love)"
vimcmd_symbol = "[<](foam)"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = " "
style = "love"
map_symbol = true

[hostname]
ssh_only = false
trim_at = "."
style = "purple"
format = "[$hostname]($style)  "
disabled = false

[jobs]
symbol = "◌"
format = "[$symbol$number](muted) "
