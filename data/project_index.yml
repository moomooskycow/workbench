# Project Index
# This file contains structured information about GitHub projects for CV
# generation. Each project entry includes metadata, technical details, and
# impact measures.
#
# Structure:
# - id: Unique identifier for the project (used for cross-referencing)
# - name: Project name
# - type: Project type (personal, professional, open-source, etc.)
# - repo_url: URL to the GitHub repository
# - description: Brief description of the project
# - tech_stack_ids: Array of technology IDs used in the project
#   (references skill_matrix.yml)
# - metrics: Quantifiable measurements of project success
# - impact_summary: Summary of project's impact and significance

---
projects:
  - id: timeismoney
    name: Time Is Money
    type: personal
    repo_url: https://github.com/phrazzld/timeismoney
    description: |
      A Chrome extension that converts prices on web pages into hours of work,
      providing users with a different perspective on the value of purchases.
      The extension allows users to set their hourly wage and automatically
      annotates prices across the web, helping users make more informed
      purchasing decisions by seeing costs in terms of their time investment.
    tech_stack_ids: ["JavaScript", "Git", "GitHub"]
    metrics:
      stars: 5
      forks: 3
      contributors: 1
      users: 30000
      downloads: 32500
    impact_summary: |
      With over 30,000 users, Time Is Money has helped thousands of people
      develop a healthier relationship with spending by contextualizing prices
      in terms of work hours. The extension has been featured in productivity
      blogs and received positive user reviews for its impact on spending.

  - id: brainstorm-press
    name: Brainstorm Press
    type: personal
    repo_url: https://github.com/phrazzld/brainstorm-press-client
    description: |
      A complete blogging platform with Bitcoin Lightning payment integration,
      allowing content creators to monetize their work through micropayments.
      Features include user authentication, content management, subscription
      models, and seamless integration with Lightning payment channels.
    tech_stack_ids: ["TypeScript", "React", "Node.js", "Express", "MongoDB", "Git"]
    metrics:
      stars: 2
      forks: 1
      contributors: 1
      users: 75
      transactions: 240
    impact_summary: |
      Brainstorm Press demonstrated a practical implementation of Bitcoin
      Lightning Network for content monetization, showcasing how creators
      can receive direct micropayments for their work without intermediaries.
      The project serves as a reference implementation for Lightning-enabled
      web applications in the growing Bitcoin ecosystem.

  - id: thinktank
    name: Thinktank
    type: open-source
    repo_url: https://github.com/phrazzld/thinktank
    description: |
      A powerful CLI tool enabling "programmable cognition" by orchestrating
      multiple large language models for complex problem-solving tasks.
      Thinktank allows developers to simultaneously query different AI models
      (like GPT-4, Claude, Gemini) and synthesize their responses for more
      robust solutions to programming challenges.
    tech_stack_ids: ["Go", "OpenAI GPT", "Git"]
    metrics:
      stars: 1
      forks: 0
      contributors: 1
      installations: 125
    impact_summary: |
      Thinktank introduces a new paradigm for AI-assisted development by
      leveraging multiple models' strengths while mitigating individual
      limitations. By orchestrating a "council" of language models, it
      produces higher quality results for complex programming tasks than
      single-model approaches, particularly for code generation and debugging.

  - id: bitcoin-price-tag
    name: Bitcoin Price Tag
    type: personal
    repo_url: https://github.com/phrazzld/bitcoin-price-tag
    description: |
      A Chrome extension that annotates fiat currency prices on websites with
      their equivalent value in Bitcoin. This gives users perspective on prices
      in terms of Bitcoin, helping Bitcoin holders make purchasing decisions by
      considering the opportunity cost of spending versus holding Bitcoin.
    tech_stack_ids: ["TypeScript"]
    metrics:
      stars: 2
      forks: 1
      contributors: 1
      users: 2500
    impact_summary: |
      Bitcoin Price Tag has gained popularity within the Bitcoin community as
      a practical tool for bitcoiners making daily purchasing decisions. By
      providing real-time BTC price equivalents while browsing, it has helped
      users develop price awareness in Bitcoin terms, contributing to broader
      Bitcoin adoption and usage as a unit of account.

