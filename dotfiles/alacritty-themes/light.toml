# Ember Dawn — warm parchment light (matches Ghostty Ember Dawn)
[colors]
primary = { background = "#f4efe8", foreground = "#2c2622" }
cursor = { text = "#f4efe8", cursor = "#c47a2a" }
vi_mode_cursor = { text = "#f4efe8", cursor = "#c47a2a" }
selection = { text = "#2c2622", background = "#e4d4be" }
search = { matches = { foreground = "#f4efe8", background = "#8a5a00" }, focused_match = { foreground = "#f4efe8", background = "#c47a2a" } }
hints = { start = { foreground = "#f4efe8", background = "#c47a2a" }, end = { foreground = "#f4efe8", background = "#8a5a00" } }
line_indicator = { foreground = "None", background = "None" }

[colors.normal]
black = "#2c2622"
red = "#b04040"
green = "#5a7a4c"
yellow = "#8a5a00"
blue = "#4a6a8a"
magenta = "#7a5a82"
cyan = "#4a7a6a"
white = "#d5cec4"

[colors.bright]
black = "#5a5248"
red = "#c25050"
green = "#6a8a5c"
yellow = "#8f5f00"
blue = "#5a7ea0"
magenta = "#8a6a92"
cyan = "#5a8a7a"
white = "#f4efe8"
