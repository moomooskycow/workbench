# Starship — terminal-native ink prompt, Nerd Font glyphs, two-line prompt
# Palette names resolve through the terminal's active ANSI theme.
add_newline = true
command_timeout = 2000
palette = "terminal-ink"

format = """
$custom\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$cmd_duration\
$time\
$line_break\
$python\
$nodejs\
$rust\
$golang\
$status\
$character"""

[palettes.terminal-ink]
base = "black"
surface = "bright-black"
overlay = "bright-black"
muted = "bright-black"
subtle = "bright-white"
text = "white"
love = "red"
gold = "yellow"
rose = "bright-red"
pine = "green"
foam = "cyan"
iris = "magenta"

[fill]
symbol = " "
style = "overlay"

[directory]
style = "bold foam"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"
read_only = " 🔒"
read_only_style = "love"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "iris"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "gold"
conflicted = "[!](love)"
ahead = "[⇡${count}](foam) "
behind = "[⇣${count}](rose) "
diverged = "[⇡${ahead_count}⇣${behind_count}](love) "
untracked = "[?](subtle)"
modified = "[*](gold)"
staged = "[+](pine)"
renamed = "[»](foam)"
deleted = "[✘](love)"
stashed = "[≡](iris) "

[git_state]
format = '\[[$state( $progress_current/$progress_total)]($style)\] '
style = "love"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "gold"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "muted"

[character]
success_symbol = "[❯](iris)"
error_symbol = "[❯](love)"
vimcmd_symbol = "[❮](foam)"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = " "
style = "love"
map_symbol = true

[python]
symbol = " "
format = "[$symbol$virtualenv ]($style)"
style = "gold"

[nodejs]
symbol = " "
format = "[$symbol($version) ]($style)"
style = "foam"
detect_files = ["package.json", ".nvmrc"]

[rust]
symbol = " "
format = "[$symbol($version) ]($style)"
style = "rose"

[golang]
symbol = " "
format = "[$symbol($version) ]($style)"
style = "foam"


[hostname]
ssh_only = true
format = "[ $hostname ](bg:overlay gold) "
disabled = false
